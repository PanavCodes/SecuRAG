[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securag"
version = "0.1.0"
description = "Agentic hybrid GraphRAG for CVE / threat-intel triage"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.0",
    "langchain-text-splitters>=1.1.0",
    "neo4j>=5.20.0",
    "neo4j-graphrag>=1.22.0",
    "pinecone>=10.2.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "ragas>=0.4.0",
    "datasets>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.40.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "lxml>=5.3.0",
    "stix2>=3.0.0",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
    "langsmith>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

